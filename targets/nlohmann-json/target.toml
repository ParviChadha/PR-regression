# Target config for nlohmann/json, read by scripts/*.sh (via scripts/lib/cfg.py).
# Only fields that Stage 0 scripts use. Documented in NOTES.md.
name = "nlohmann-json"
upstream_url = "https://github.com/nlohmann/json"
pinned_sha = "0e95fe8200adbf0e033d0c0818eea473e1d4d346"            # upstream develop HEAD tested in Stage 0 (v3.11.3-763-g0e95fe820)

# Extra data the tests need, vendored into the image at build time (no runtime network).
test_data_url = "https://github.com/nlohmann/json_test_data/archive/refs/tags/v3.2.0.tar.gz"
test_data_sha256 = "9a9dc990be2cb51f0fb85e10065c6e52cd4c29c0704cc302f8352efeda3630b9"
test_data_dir = "/opt/test_data"   # path inside the image

# Git repos that tests fetch at configure time (FetchContent), mirrored into the image and
# redirected with git url.insteadOf, so tests run offline. Format: "<url>@<tag>@<commit sha>".
vendored_git = ["https://github.com/fmtlib/fmt.git@12.2.0@1be298e1bd68957e4cd352e1f676f00e07dcfb57"]

# CMake configure options (the source dir and build dir are supplied by the scripts).
cmake_args = ["-DCMAKE_BUILD_TYPE=Debug", "-DJSON_BuildTests=ON", "-DJSON_TestDataDirectory=/opt/test_data"]
coverage_cmake_args = ["-DCMAKE_CXX_FLAGS=--coverage"]
# ctest arguments (the scripts add --parallel and --output-on-failure)
ctest_args = []

# Paths relative to the repo root.
test_paths = ["tests/src"]
public_headers = ["include/nlohmann"]
coverage_scope = ["include/nlohmann"]   # gcovr --filter, relative to repo root

# ---- Stage 1: PR collection (pipeline/collect.py) ----
github_repo = "nlohmann/json"
main_source = ["include"]               # a PR must change C++ files under these paths to be checked
generated_paths = ["single_include"]    # amalgamated header regenerated by every PR; never counts as main source
max_main_files = 3                      # Testora's limit
sample_checked = 120                    # walk newest PRs until this many pass the filters
collect_head = "abbc29963a3fa7652127a57a9e2a4494ec5b8a6e"   # develop, 2026-11-15: history sampled from here (reproducible)
seed_prs = [4958, 5459]                 # known answers, always collected (see NOTES.md)

# Used by pipeline/generate.py: PRs that change a file whose path contains one of `when` also get this header in the prompt.
# json_view (json_document, json_view, image_check, ...) is declared only in nlohmann/json_view.hpp, which json.hpp does not include.
extra_headers = [
  { header = "nlohmann/json_view.hpp", when = ["detail/view/", "json_view"], note = "The json_view feature (json_document, json_view and their image loading and editing API) is declared only in this header; nlohmann/json.hpp does not include it, so without this line those names do not exist. Use only names you can see in the diff or the context below." },
]

# Used by pipeline/env.py. header-only: old/new environments are source exports of include_dirs only
# (no library build); tests compile directly against them. Other modes (e.g. "cmake") come with QuantLib/duckdb.
build_mode = "header-only"
include_dirs = ["include"]              # roots passed as -I; relative to repo root
smoke_header = "nlohmann/json.hpp"      # env.py --check compiles `#include <smoke_header>` against old and new

# Used by pipeline/changes.py: the public headers whose #include reaches the whole library (json_view.hpp is a
# separate public header that json.hpp does not include; headers missing at an older commit are skipped).
analysis_entries = ["nlohmann/json.hpp", "nlohmann/json_view.hpp"]
# Lines compiled out by default are mapped again with these flags (one parse per set).
# A later -std overrides the default c++17 (code under __cpp_lib_char8_t etc. exists only in C++20).
analysis_variants = [["-DJSON_DIAGNOSTICS=1", "-DJSON_DIAGNOSTIC_POSITIONS=1"], ["-std=c++20"]]

# Used by pipeline/generate.py: library-specific rules appended to the test-generation prompt.
prompt_notes = '''
- Include the library with #include <nlohmann/json.hpp>. The public API is nlohmann::json (nlohmann::basic_json), nlohmann::ordered_json, json_pointer, json patch/merge_patch and the documented SAX and conversion interfaces. Never use the detail namespace.
- It is a header-only library: nothing to link. Programs are compiled as C++17.
- Print JSON values with dump() (compact) or dump(2). Keys of nlohmann::json objects print in sorted order, so output is deterministic; do not depend on insertion order except with ordered_json.
'''
