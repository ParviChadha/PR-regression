# Target config for duckdb, read by pipeline/env.py (and scripts/*.sh via scripts/lib/cfg.py).
name = "duckdb"
upstream_url = "https://github.com/duckdb/duckdb"
pinned_sha = "4c0adf6440aa4aa6cac81bfedae264cfe5324863"   # upstream main HEAD on 2026-11-17

# build_mode "cmake": env.py builds the library at the parent commit, then incrementally at the merge commit,
# in one persistent build volume (prh-duckdb-build) with ccache (prh-duckdb-ccache). Generated tests link the shared library.
build_mode = "cmake"
# Core engine only: no shell, no unittest runner, no sanitizers; icu/json/parquet skipped (long compiles, not core);
# core_functions stays (most scalar/aggregate functions live there); no httplib/loadable-extension capabilities.
# FORCE_ASSERT keeps D_ASSERT active in the Release build so an internal assertion failure shows up as a crash.
cmake_args = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DBUILD_UNITTESTS=OFF",
  "-DBUILD_SHELL=OFF",
  "-DENABLE_SANITIZER=OFF",
  "-DENABLE_UBSAN=OFF",
  "-DFORCE_ASSERT=ON",
  "-DSKIP_EXTENSIONS=icu;json;parquet",
  "-DSTATICALLY_LINK_EXTENSIONS=core_functions",
  "-DDUCKDB_CAPABILITIES=none",
]
build_target = "duckdb"                 # builds src/libduckdb.so (shared) in the build dir
library = "src/libduckdb.so"            # relative to the build dir; copied to cache/worktrees/duckdb/<sha>/lib/
# Source tree needed to configure and build, exported per commit (no test/, data/, benchmark/: ~100 MB instead of ~440 MB).
export_paths = ["CMakeLists.txt", "DuckDBConfig.cmake.in", "DuckDBConfigVersion.cmake.in", "LICENSE",
                "extension", "scripts", "src", "third_party", "tools", ".github/config"]
include_dirs = ["src/include"]          # -I for generated tests, relative to each export (duckdb.hpp includes everything needed)
# env.py --check compiles, links and runs this against old and new.
smoke_source = '''
#include "duckdb.hpp"
int main() {
    duckdb::DuckDB db(nullptr);
    duckdb::Connection con(db);
    auto r = con.Query("SELECT 42");
    return (!r || r->HasError()) ? 1 : 0;
}
'''

# ---- PR collection (pipeline/collect.py) ----
github_repo = "duckdb/duckdb"
# The engine, plus core_functions: the only extension this build compiles (statically linked). PRs that change only
# json/parquet/icu or other extensions are not testable with this build, so they do not count as main source.
main_source = ["src", "extension/core_functions"]
# Generated files: a file whose first 20 lines match generated_marker (enum_util.cpp, serialize_*.cpp, the
# *_functions.hpp declaration headers, ...), plus the two function registries whose marker sits further down.
# enum_util.cpp alone is rewritten by ~60% of PRs; counted as source it would push most PRs over max_main_files.
generated_marker = 'this file is (auto(matically)?[- ])?generated|do not edit'
generated_paths = ["src/function/function_list.cpp", "extension/core_functions/function_list.cpp"]
max_main_files = 3                      # Testora's limit, as for nlohmann-json
sample_checked = 60                     # the midterm's plan for duckdb
collect_head = "4c0adf6440aa4aa6cac81bfedae264cfe5324863"   # = pinned_sha (main, 2026-11-17), the commit env.py was checked on
# Known answers, both within the filters (like #4958/#5459 for nlohmann-json):
# #27903 intends SUMMARIZE over nanosecond temporal types, and unintentionally (fixed in #28401) stops avg and
#   approx_quantile of TIMESTAMP_S/TIMESTAMP_MS/DATE from widening to TIMESTAMP and makes infinite TIMESTAMP_NS
#   values finite in approx_quantile;
# #27289 intentionally adds add_grammar_extension/remove_grammar_extension.
# (#24878 double-quoted identifiers and #27761 DROP TYPE are cleaner stories but change 83 and 8 main files.)
seed_prs = [27903, 27289]

# Used by pipeline/generate.py: library-specific rules appended to the test-generation prompt.
prompt_notes = '''
- Include the library with #include "duckdb.hpp" and use its C++ API: duckdb::DuckDB db(nullptr); duckdb::Connection con(db); auto result = con.Query("..."); always check result->HasError() and print result->GetError() instead of crashing.
- Use only an in-memory database. No files, no network, no extensions: the icu, json and parquet extensions are NOT available, only the core engine and core_functions (so no time zone or JSON/Parquet functions).
- Row order is not guaranteed without ORDER BY: give every query that can return more than one row a total ORDER BY. Do not print timings, memory or thread counts, or the version or commit hash.
- Print results with result->ToString(), or iterate rows with result->GetValue(column, row).ToString(). Use fixed precision for floating point.
'''
