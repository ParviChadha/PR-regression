# Target config for QuantLib (https://github.com/lballabio/QuantLib), read by pipeline/*.py and scripts/lib/cfg.py.
name = "quantlib"
upstream_url = "https://github.com/lballabio/QuantLib"
pinned_sha = "4b7275324c0fb5f7d8addcfaeaa0c3f494136497"   # master HEAD on 2026-11-23

# build_mode "cmake" (pipeline/env.py, as for duckdb): the library is built at the parent commit, then
# incrementally at the merge commit, in the prh-quantlib container; generated tests link the shared library.
build_mode = "cmake"
# - Examples and test suite off: only the library is needed (the test suite would also need Boost.Test).
# - QL_FASTER_LAZY_OBJECTS OFF: the CMake default is ON, but it is set through a generated ql/config.hpp that
#   generated tests do not see (they compile against the source tree's headers, which define nothing). The macro
#   changes a default member value in ql/patterns/lazyobject.hpp, so library and tests must agree; with every
#   QL_* option off, the source headers and the built library match exactly.
# - CMAKE_PLATFORM_NO_VERSIONED_SONAME: the library is otherwise named libQuantLib.so.1 at run time, while env.py
#   copies one file (libQuantLib.so) next to each export and links it with -lQuantLib and an rpath.
cmake_args = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DBUILD_SHARED_LIBS=ON",
  "-DQL_BUILD_EXAMPLES=OFF",
  "-DQL_BUILD_TEST_SUITE=OFF",
  "-DQL_BUILD_FUZZ_TEST_SUITE=OFF",
  "-DQL_FASTER_LAZY_OBJECTS=OFF",
  "-DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON",
]
build_target = "ql_library"
library = "ql/libQuantLib.so"           # relative to the build dir; copied to cache/worktrees/quantlib/<sha>/lib/
# What CMake needs to configure and build the library (no Docs/, Examples/, test-suite/).
export_paths = ["CMakeLists.txt", "cmake", "ql", "quantlib-config.in", "quantlib.pc.in"]
include_dirs = ["."]                    # tests use #include <ql/quantlib.hpp>; relative to each export
# env.py --check compiles, links and runs this against old and new. 15 Jan 2026 is a TARGET business day.
smoke_source = '''
#include <ql/quantlib.hpp>
#include <iostream>
int main() {
    using namespace QuantLib;
    Date d(15, January, 2026);
    Calendar c = TARGET();
    std::cout << c.advance(d, 1, Months) << std::endl;
    return c.isBusinessDay(d) ? 0 : 1;
}
'''

# ---- PR collection (pipeline/collect.py) ----
github_repo = "lballabio/QuantLib"
main_source = ["ql"]
# ql/**/all.hpp and ql/quantlib.hpp start with "This file is automatically generated; do not edit": every PR that adds
# a source file updates one, so they must not count as main source (same marker rule as duckdb).
generated_marker = 'this file is (auto(matically)?[- ])?generated|do not edit'
max_main_files = 3                      # Testora's limit, as for the other targets
sample_checked = 60                     # the midterm's plan for QuantLib
collect_head = "4b7275324c0fb5f7d8addcfaeaa0c3f494136497"   # = pinned_sha
# Known answers. QuantLib's history names no PR as the cause of a regression (its two reverts give no reason), so
# both are intended behavior changes, visible in a test's output:
# #3051 fixes Easter, Labour Day and Sunday holidays in the Serbia calendar; #3080 fixes theta and vanna in
# BachelierCalculator.
seed_prs = [3051, 3080]

# ---- change analysis (pipeline/changes.py); include_dirs above is used for -I ----
test_paths = ["test-suite"]             # pipeline/context.py: upstream tests (Boost.Test BOOST_AUTO_TEST_CASE blocks)
analysis_entries = ["ql/quantlib.hpp"]  # includes the whole library except ql/experimental
private_namespaces = ["detail", "details", "impl", "internal"]

# Used by pipeline/generate.py: library-specific rules appended to the test-generation prompt.
prompt_notes = '''
- Include only the specific QuantLib headers you use (e.g. #include <ql/time/calendars/target.hpp>, #include <ql/pricingengines/blackcalculator.hpp>), not <ql/quantlib.hpp>: the umbrella header takes about 12 s to compile per program, a specific header under 1 s. Use namespace QuantLib. The library is linked for you.
- Always set the evaluation date first, e.g. Settings::instance().evaluationDate() = Date(15, January, 2026); never depend on today's date, which makes output change from day to day.
- Print numbers with fixed precision (std::fixed << std::setprecision(10)) and dates with operator<<.
- Prefer analytic and lattice/finite-difference pricing engines. Do not use Monte Carlo engines (slow, and their output depends on seeds and thread counts).
- Wrap calls that may fail in try/catch (std::exception& e) and print e.what() instead of crashing.
'''
